<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#062a24"/></linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.45" r="0.5"><stop offset="0" stop-color="#10b981" stop-opacity="0.28"/><stop offset="1" stop-color="#10b981" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/></pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#grid)"/><rect width="1200" height="675" fill="url(#glow)"/>
  <!-- Scales of justice -->
  <g transform="translate(330 330)" fill="none" stroke="#6ee7b7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 -170 V150"/><path d="M-70 150 H70"/><circle cx="0" cy="-178" r="12" fill="#6ee7b7"/>
    <path d="M-150 -120 H150"/>
    <path d="M-150 -120 L-205 10 M-150 -120 L-95 10"/><path d="M-215 10 Q-150 70 -85 10 Z" fill="#6ee7b7" fill-opacity="0.15"/>
    <path d="M150 -120 L95 10 M150 -120 L205 10"/><path d="M85 10 Q150 70 215 10 Z" fill="#6ee7b7" fill-opacity="0.15"/>
  </g>
  <!-- Old vs new law cards -->
  <g font-family="-apple-system, Segoe UI, Roboto, sans-serif">
    <rect x="640" y="170" width="200" height="120" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="740" y="222" text-anchor="middle" font-size="22" fill="#94a3b8" font-weight="600">Old law</text>
    <text x="740" y="262" text-anchor="middle" font-size="34" fill="#e2e8f0" font-weight="800">IPC</text>
    <path d="M858 230 H902" stroke="#6ee7b7" stroke-width="5" stroke-linecap="round"/><path d="M890 218 L904 230 L890 242" fill="none" stroke="#6ee7b7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="920" y="170" width="200" height="120" rx="18" fill="#10b981" fill-opacity="0.14" stroke="#6ee7b7" stroke-opacity="0.5"/>
    <text x="1020" y="222" text-anchor="middle" font-size="22" fill="#6ee7b7" font-weight="600">New law</text>
    <text x="1020" y="262" text-anchor="middle" font-size="34" fill="#ecfdf5" font-weight="800">BNS</text>
    <!-- Search bar -->
    <rect x="640" y="340" width="480" height="70" rx="35" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
    <circle cx="684" cy="372" r="13" fill="none" stroke="#94a3b8" stroke-width="4"/><path d="M694 382 L704 392" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <text x="722" y="383" font-size="24" fill="#94a3b8">Search sections offline</text>
    <!-- Result lines -->
    <rect x="640" y="440" width="480" height="18" rx="9" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="640" y="474" width="390" height="18" rx="9" fill="#ffffff" fill-opacity="0.07"/>
    <rect x="640" y="508" width="430" height="18" rx="9" fill="#ffffff" fill-opacity="0.05"/>
  </g>
</svg>
