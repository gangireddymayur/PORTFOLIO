<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c2a4a"/><stop offset="1" stop-color="#061629"/></linearGradient>
    <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="7"/><feColorMatrix values="0 0 0 0 0.3  0 0 0 0 0.55  0 0 0 0 0.8  0 0 0 0.18 0"/></filter>
    <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V14" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4"/></pattern>
    <g id="ship"><path d="M-26 0 Q-20 -7 0 -7 L22 -7 Q30 0 22 7 L0 7 Q-20 7 -26 0 Z" fill="#f1f5f9"/><rect x="-6" y="-4" width="12" height="8" rx="2" fill="#94a3b8"/></g>
  </defs>
  <rect width="1200" height="675" fill="url(#sea)"/><rect width="1200" height="675" filter="url(#noise)"/>
  <!-- Coastline -->
