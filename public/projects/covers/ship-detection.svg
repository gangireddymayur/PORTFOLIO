    <g transform="translate(640 210) rotate(-18)"><use href="#ship"/></g>
    <rect x="598" y="178" width="86" height="62" fill="none" stroke="#22d3ee" stroke-width="3"/><rect x="598" y="152" width="112" height="26" fill="#22d3ee"/><text x="604" y="171" fill="#04293a">ship 0.97</text>
    <g transform="translate(905 380) rotate(25) scale(1.3)"><use href="#ship"/></g>
    <rect x="860" y="342" width="92" height="78" fill="none" stroke="#22d3ee" stroke-width="3"/><rect x="860" y="316" width="112" height="26" fill="#22d3ee"/><text x="866" y="335" fill="#04293a">ship 0.94</text>
    <g transform="translate(560 520) rotate(8) scale(0.9)"><use href="#ship"/></g>
    <rect x="522" y="496" width="78" height="50" fill="none" stroke="#22d3ee" stroke-width="3"/><rect x="522" y="470" width="112" height="26" fill="#22d3ee"/><text x="528" y="489" fill="#04293a">ship 0.91</text>
    <g transform="translate(1070 150) rotate(-40) scale(0.8)"><use href="#ship"/></g>
